{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %}{% endblock %}

{% block content %}
<section class="section-gap">
  <div class="container text-center">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card p-5" style="border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-radius: 10px;">
          <span class="lnr lnr-checkmark-circle mb-3" style="font-size: 50px; color: #28a745;"></span>
          <h3 class="mb-3">{% trans "The password has been changed!" %}</h3>
          <p class="text-muted"><a href="{% url 'user_management:login' %}" class="primary-btn text-uppercase">{% trans "Log in now" %}</a></p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
