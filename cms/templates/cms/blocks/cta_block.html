<section class="cms-block-cta py-5">
    <div class="container">
        <div class="card shadow-sm">
            <div class="card-body d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 p-4">
                <div>
                    <h2 class="h3 mb-1">{{ self.heading }}</h2>
                    {% if self.body %}
                        <p class="text-muted mb-0">{{ self.body }}</p>
                    {% endif %}
                </div>
                {% if self.button_text and self.button_url %}
                    <a href="{{ self.button_url }}" class="btn btn-primary">
                        {{ self.button_text }}
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</section>
