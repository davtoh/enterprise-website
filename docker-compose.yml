# ==============================================================================
# Docker Compose Architecture for Enterprise Website
# Services: web (Django/Daphne ASGI), db (PostgreSQL 16), redis (7), nginx (1.27)
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_web
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-super-secret-key-change-in-env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,nginx,web}
      - USE_SQLITE=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-enterprise_db}
      - DB_USER=${DB_USER:-enterprise_user}
      - DB_PASSWORD=${DB_PASSWORD:-enterprise_secure_password}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  db:
    image: postgres:16-alpine
    container_name: enterprise_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-enterprise_db}
      - POSTGRES_USER=${DB_USER:-enterprise_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-enterprise_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-enterprise_user} -d ${DB_NAME:-enterprise_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enterprise_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: enterprise_nginx
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
