{% load static %}
<!-- Global Cascade Layer Hierarchy & Bootstrap 5.3.3 Core CSS (@layer framework) -->
<style>
  @layer tokens, framework, adapter, components, utilities;
  @import url("https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css") layer(framework);
  @import url("{% static 'css/main.css' %}") layer(framework);
  @import url("{% static 'css/django.css' %}") layer(components);
</style>

<!-- Modern Google Typography -->
<link href="https://fonts.googleapis.com/css?family=Poppins:100,200,400,300,500,600,700" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
<link rel="stylesheet" href="{% static 'css/linearicons.css' %}">

<!-- Additional Agency Plugins (if present) -->
<link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}">
<link rel="stylesheet" href="{% static 'css/animate.min.css' %}">

<!-- Reusable Design Tokens & Framework Layout Adapter -->
<link rel="stylesheet" href="{% static 'css/theme-tokens.css' %}">
<link rel="stylesheet" href="{% static 'css/theme-adapter.css' %}">
