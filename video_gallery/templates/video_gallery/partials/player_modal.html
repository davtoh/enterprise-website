{% load i18n %}

<!-- Bootstrap 5 Video Player Modal -->
<div class="modal fade" id="videoPlayerModal" tabindex="-1" aria-labelledby="videoPlayerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden bg-white">
            
            <!-- Modal Header -->
            <div class="modal-header border-0 pb-0 pt-3 px-4 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <span id="modalVideoBadge" class="badge bg-secondary text-uppercase px-2 py-1">
                        {% trans "Video" %}
                    </span>
                    <h5 class="modal-title fw-bold text-dark mb-0" id="videoPlayerModalLabel">
                        <!-- Populated dynamically via JS -->
                    </h5>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
            </div>

            <!-- Modal Body (16:9 Player) -->
            <div class="modal-body p-3 p-md-4">
                <div class="ratio ratio-16x9 bg-black rounded-3 overflow-hidden shadow-sm">
                    <!-- Iframe Player (YouTube / Vimeo) -->
                    <iframe 
                        id="modalIframePlayer" 
                        src="" 
                        title="{% trans 'Video Player' %}" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen
                        class="w-100 h-100 border-0">
                    </iframe>

                    <!-- HTML5 Direct Player (MP4) -->
                    <video 
                        id="modalHtml5Player" 
                        src="" 
                        controls 
                        playsinline 
                        class="w-100 h-100 object-fit-contain d-none bg-black">
                    </video>
                </div>

                <!-- Video Description Section -->
                <div id="modalVideoDescContainer" class="mt-3 px-2 d-none">
                    <h6 class="fw-semibold text-muted small text-uppercase mb-1">{% trans "About this video" %}</h6>
                    <p id="modalVideoDescription" class="text-secondary small mb-0"></p>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer border-0 pt-0 px-4 pb-3 d-flex justify-content-between align-items-center">
                <small class="text-muted"><i class="fa fa-info-circle me-1"></i> {% trans "Press ESC or click outside to close" %}</small>
                <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">
                    {% trans "Close" %}
                </button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var modalEl = document.getElementById('videoPlayerModal');
    if (!modalEl) return;

    var iframePlayer = document.getElementById('modalIframePlayer');
    var html5Player = document.getElementById('modalHtml5Player');
    var modalTitle = document.getElementById('videoPlayerModalLabel');
    var modalBadge = document.getElementById('modalVideoBadge');
    var descContainer = document.getElementById('modalVideoDescContainer');
    var descText = document.getElementById('modalVideoDescription');

    modalEl.addEventListener('show.bs.modal', function (event) {
        var trigger = event.relatedTarget;
        if (!trigger) return;

        var title = trigger.getAttribute('data-video-title') || '';
        var desc = trigger.getAttribute('data-video-description') || '';
        var source = trigger.getAttribute('data-video-source') || '';
        var playerUrl = trigger.getAttribute('data-player-url') || '';
        var isHtml5 = trigger.getAttribute('data-is-html5') === 'true';
        var mediaUrl = trigger.getAttribute('data-media-url') || '';

        // Update Title & Description
        modalTitle.textContent = title;
        if (desc.trim()) {
            descText.textContent = desc;
            descContainer.classList.remove('d-none');
        } else {
            descContainer.classList.add('d-none');
        }

        // Update Badge
        modalBadge.className = 'badge text-uppercase px-2 py-1 shadow-sm';
        if (source === 'youtube') {
            modalBadge.classList.add('bg-danger');
            modalBadge.innerHTML = '<i class="fa fa-youtube-play me-1"></i> YouTube';
        } else if (source === 'vimeo') {
            modalBadge.classList.add('bg-info', 'text-white');
            modalBadge.innerHTML = '<i class="fa fa-vimeo me-1"></i> Vimeo';
        } else {
            modalBadge.classList.add('bg-primary');
            modalBadge.innerHTML = '<i class="fa fa-file-video-o me-1"></i> MP4 Video';
        }

        // Activate either HTML5 player or Iframe player
        if (isHtml5 && mediaUrl) {
            iframePlayer.classList.add('d-none');
            iframePlayer.src = '';
            html5Player.classList.remove('d-none');
            html5Player.src = mediaUrl;
            html5Player.play().catch(function() {});
        } else {
            html5Player.pause();
            html5Player.classList.add('d-none');
            html5Player.src = '';
            iframePlayer.classList.remove('d-none');
            iframePlayer.src = playerUrl;
        }
    });

    // When modal closes, immediately stop all video/audio playback
    modalEl.addEventListener('hidden.bs.modal', function () {
        if (iframePlayer) {
            iframePlayer.src = '';
        }
        if (html5Player) {
            html5Player.pause();
            html5Player.currentTime = 0;
            html5Player.src = '';
        }
    });
});
</script>
