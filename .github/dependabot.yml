version: 2
updates:
  # Python Dependencies
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Disallow pre-releases (alpha, beta, rc) to avoid unstable candidate builds
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-pre-release"]
    # Group interdependent packages into unified PRs to prevent broken isolated bumps
    groups:
      django-stack:
        applies-to: version-updates
        patterns:
          - "django"
          - "djangorestframework"
          - "django-allauth"
          - "django-rosetta"
          - "django-countries"
          - "django-phonenumber-field"
      asgi-channels-stack:
        applies-to: version-updates
        patterns:
          - "channels"
          - "channels-redis"
          - "daphne"
          - "twisted"
          - "autobahn"
      testing-tools:
        applies-to: version-updates
        patterns:
          - "pytest"
          - "pytest-*"
          - "flake8"
          - "black"

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-pre-release"]

