{% load i18n %}
<!-- Multi-Site Operations Toolbar -->
<div class="card shadow-sm border-0 mb-4 bg-dark text-white">
  <div class="card-body p-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-danger d-inline-flex align-items-center gap-1 px-2 py-1">
        <span class="spinner-grow spinner-grow-sm text-light" style="width: 8px; height: 8px;" role="status"></span>
        <span class="small fw-bold">LIVE SOC FEED</span>
      </span>
      <h6 class="mb-0 fw-bold text-light ms-1">
        <i class="fa fa-desktop me-1 text-info"></i>{% trans "Multi-Camera Surveillance Matrix" %}
      </h6>
    </div>

    <div class="d-flex flex-wrap align-items-center gap-2">
      <!-- Site Filter Dropdown -->
      <form method="get" class="d-flex align-items-center gap-2 m-0" id="siteFilterForm">
        <input type="hidden" name="layout" value="{{ layout_mode }}">
        <label class="small text-muted mb-0 d-none d-md-inline">{% trans "Facility:" %}</label>
        <select name="site_id" class="form-select form-select-sm bg-dark text-light border-secondary" style="min-width: 180px;" onchange="this.form.submit()">
          <option value="">{% trans "All Facilities & Sites" %}</option>
          {% for loc in locations %}
            <option value="{{ loc.id }}" {% if selected_site_id == loc.id|stringformat:"s" %}selected{% endif %}>
              {{ loc.name }} ({{ loc.code }})
            </option>
          {% endfor %}
        </select>
      </form>

      <!-- Matrix Layout Switcher -->
      <div class="btn-group btn-group-sm" role="group" aria-label="Grid Layout">
        <a href="?layout=solo{% if selected_site_id %}&site_id={{ selected_site_id }}{% endif %}"
           class="btn btn-outline-secondary {% if layout_mode == 'solo' %}active text-white border-primary bg-primary{% endif %}" title="{% trans 'Solo View (1 Camera)' %}">
          <i class="fa fa-square"></i>
        </a>
        <a href="?layout=grid{% if selected_site_id %}&site_id={{ selected_site_id }}{% endif %}"
           class="btn btn-outline-secondary {% if layout_mode == 'grid' or layout_mode == '2x2' or not layout_mode %}active text-white border-primary bg-primary{% endif %}" title="{% trans '2x2 Grid View' %}">
          <i class="fa fa-th-large"></i>
        </a>
        <a href="?layout=3x3{% if selected_site_id %}&site_id={{ selected_site_id }}{% endif %}"
           class="btn btn-outline-secondary {% if layout_mode == '3x3' %}active text-white border-primary bg-primary{% endif %}" title="{% trans '3x3 Matrix View' %}">
          <i class="fa fa-th"></i>
        </a>
      </div>

      <!-- Audible Alarm Toggle Button -->
      <button type="button" class="btn btn-outline-warning btn-sm" id="btnAudioChime" onclick="toggleAudioAlarm()">
        <i class="fa fa-volume-up me-1"></i><span id="audioStatusText">{% trans "Alarm Audio: ON" %}</span>
      </button>

      <!-- Quick Simulate Button -->
      <a href="{% url 'intelligent_tracker_hub:simulate_dispatch' %}" class="btn btn-outline-info btn-sm">
        <i class="fa fa-bolt me-1"></i>{% trans "Simulate Intrusion" %}
      </a>
    </div>
  </div>
</div>
