{% load i18n %}
<!-- KPI Metric Cards -->
<div class="row g-3 mb-4">
  <div class="col-sm-6 col-lg-3">
    <div class="card shadow-sm border-0 h-100">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-circle d-flex align-items-center justify-content-center">
          <i class="fa fa-bell fa-lg"></i>
        </div>
        <div>
          <h6 class="card-subtitle text-muted small fw-bold text-uppercase">{% trans "Total Events" %}</h6>
          <h3 class="card-title mb-0 fw-bold">{{ total_events }}</h3>
        </div>
      </div>
    </div>
  </div>
  <div class="col-sm-6 col-lg-3">
    <div class="card shadow-sm border-0 h-100">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="bg-warning bg-opacity-10 text-warning p-3 rounded-circle d-flex align-items-center justify-content-center">
          <i class="fa fa-exclamation-circle fa-lg"></i>
        </div>
        <div>
          <h6 class="card-subtitle text-muted small fw-bold text-uppercase">{% trans "Unresolved" %}</h6>
          <h3 class="card-title mb-0 fw-bold">{{ unresolved_count }}</h3>
        </div>
      </div>
    </div>
  </div>
  <div class="col-sm-6 col-lg-3">
    <div class="card shadow-sm border-0 h-100">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="bg-danger bg-opacity-10 text-danger p-3 rounded-circle d-flex align-items-center justify-content-center">
          <i class="fa fa-fire fa-lg"></i>
        </div>
        <div>
          <h6 class="card-subtitle text-muted small fw-bold text-uppercase">{% trans "Critical Alarms" %}</h6>
          <h3 class="card-title mb-0 fw-bold">{{ critical_count }}</h3>
        </div>
      </div>
    </div>
  </div>
  <div class="col-sm-6 col-lg-3">
    <div class="card shadow-sm border-0 h-100">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="bg-success bg-opacity-10 text-success p-3 rounded-circle d-flex align-items-center justify-content-center">
          <i class="fa fa-video-camera fa-lg"></i>
        </div>
        <div>
          <h6 class="card-subtitle text-muted small fw-bold text-uppercase">{% trans "Cameras Online" %}</h6>
          <h3 class="card-title mb-0 fw-bold">
            {{ cameras_online }} <span class="text-muted fs-6 fw-normal">/ {{ cameras_total }}</span>
          </h3>
        </div>
      </div>
    </div>
  </div>
</div>
