{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Sign Up" %}{% endblock %}

{% block content %}
<section class="section-gap">
  <div class="container">
    <h2>{% trans "Sign up" %}</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="primary-btn text-uppercase">{% trans "Sign up" %}</button>
    </form>
  </div>
</section>
{% endblock %}
