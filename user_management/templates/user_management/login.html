{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Login" %}{% endblock %}

{% block content %}
<section class="section-gap">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="card p-4" style="border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-radius: 10px;">
          <h2 class="mb-4 text-center">{% trans "Sign In" %}</h2>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="mt-4 d-flex justify-content-between align-items-center">
              <button type="submit" class="primary-btn text-uppercase">{% trans "Login" %}</button>
              <a href="{{request.META.HTTP_REFERER|default:'/'}}" class="genric-btn default text-uppercase">{% trans "Cancel" %}</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
