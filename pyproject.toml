[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "create-enterprise-site"
version = "0.1.0"
description = "Zero-dependency CLI to scaffold standalone composable enterprise Django & Wagtail sites."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["django", "wagtail", "scaffolding", "cli", "enterprise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
create-enterprise-site = "create_enterprise_site.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "create_enterprise_site*",
    "plugin_registry",
    "plugin_registry.scaffolding*",
]
