{% extends "erp/base_erp.html" %}
{% load i18n humanize %}

{% block erp_content %}
<div class="card shadow-sm border-0 rounded-3 mb-4">
  <div class="card-header bg-transparent border-0 pt-3 px-4 d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
    <div>
      <h5 class="fw-bold mb-0">{% trans "Product Catalog" %}</h5>
      <small class="text-body-secondary">{% trans "Manage product specifications, pricing tiers, and stock definitions" %}</small>
    </div>
    <div class="d-flex align-items-center gap-2">
      <form method="get" class="d-flex align-items-center gap-2"
            hx-get="{% url 'erp:product_list' %}"
            hx-target="#product-table-container"
            hx-push-url="true">
        <input type="text" name="q" class="form-control form-control-sm" placeholder="{% trans 'Search products...' %}" value="{{ search_query }}">
        <button type="submit" class="btn btn-sm btn-outline-secondary"><i class="fa fa-search"></i></button>
      </form>
      <a href="{% url 'erp:product_create' %}" class="btn btn-sm btn-primary text-nowrap">
        <i class="fa fa-plus me-1"></i>{% trans "Add Product" %}
      </a>
    </div>
  </div>

  <div class="card-body p-0" id="product-table-container">
    {% include "erp/partials/product_table.html" %}
  </div>
</div>
{% endblock %}
