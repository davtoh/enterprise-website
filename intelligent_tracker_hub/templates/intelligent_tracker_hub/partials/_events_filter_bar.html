{% load i18n %}
<!-- Filters Bar -->
<div class="card shadow-sm border-0 mb-4">
  <div class="card-body p-3">
    <form method="get" class="row g-2 align-items-center">
      <input type="hidden" name="layout" value="{{ layout_mode }}">
      <input type="hidden" name="site_id" value="{{ selected_site_id }}">
      <div class="col-md-3">
        <label class="form-label small fw-bold mb-1">{% trans "Event Type" %}</label>
        <select name="event_type" class="form-select form-select-sm">
          <option value="">{% trans "All Event Types" %}</option>
          {% for val, label in event_types %}
            <option value="{{ val }}" {% if selected_event_type == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small fw-bold mb-1">{% trans "Severity" %}</label>
        <select name="severity" class="form-select form-select-sm">
          <option value="">{% trans "All Severities" %}</option>
          {% for val, label in severities %}
            <option value="{{ val }}" {% if selected_severity == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small fw-bold mb-1">{% trans "Status" %}</label>
        <select name="status" class="form-select form-select-sm">
          <option value="">{% trans "All Statuses" %}</option>
          <option value="unresolved" {% if selected_status == "unresolved" %}selected{% endif %}>{% trans "Unresolved Only" %}</option>
          <option value="resolved" {% if selected_status == "resolved" %}selected{% endif %}>{% trans "Resolved Only" %}</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label small fw-bold mb-1">{% trans "Camera ID" %}</label>
        <input type="text" name="camera_id" class="form-control form-control-sm" placeholder="e.g. cam-north" value="{{ selected_camera_id }}">
      </div>
      <div class="col-md-2 d-flex gap-2 align-items-end mt-auto">
        <button type="submit" class="btn btn-primary btn-sm flex-grow-1">
          <i class="fa fa-filter me-1"></i>{% trans "Filter" %}
        </button>
        <a href="{% url 'intelligent_tracker_hub:dashboard' %}" class="btn btn-outline-secondary btn-sm" title="{% trans 'Reset Filters' %}">
          <i class="fa fa-times"></i>
        </a>
      </div>
    </form>
  </div>
</div>
