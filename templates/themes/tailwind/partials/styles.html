{% load static %}
<!-- Reusable Design Tokens & Shared Grid Adapter -->
<link rel="stylesheet" href="{% static 'css/theme-tokens.css' %}">
<link rel="stylesheet" href="{% static 'css/theme-adapter.css' %}">

<!-- Tailwind CSS via CDN with Typography & Forms plugins -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#fff8f5',
            100: '#ffe38c',
            200: '#ffd0b8',
            500: '#ffa98c',
            600: '#ff7d59',
            700: '#e8633d',
            800: '#c84e2b',
            900: '#222222',
          }
        },
        fontFamily: {
          sans: ['Poppins', 'system-ui', 'sans-serif'],
        }
      }
    }
  }
</script>

<!-- Google Font & Icons -->
<link href="https://fonts.googleapis.com/css?family=Poppins:100,200,400,300,500,600,700" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">

<style>
  [x-cloak] {
    display: none !important;
  }

  /* Tailwind compatibility utilities for Django form elements and buttons */
  .table {
    width: 100%;
    border-collapse: collapse;
  }
  .table th, .table td {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #e5e7eb;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    border-radius: 0.375rem;
    transition: all 0.15s ease-in-out;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-primary {
    background-color: var(--color-primary, #ff7d59);
    color: #ffffff;
    border: 1px solid transparent;
  }
  .btn-primary:hover {
    background-color: var(--brand-primary-hover, #e8633d);
    color: #ffffff;
  }
  .btn-secondary {
    background-color: #64748b;
    color: #ffffff;
  }
  .btn-success {
    background-color: #16a34a;
    color: #ffffff;
  }
  .btn-danger {
    background-color: #dc2626;
    color: #ffffff;
  }
  .btn-outline-primary {
    border: 1px solid var(--color-primary, #ff7d59);
    color: var(--color-primary, #ff7d59);
    background-color: transparent;
  }
  .btn-outline-primary:hover {
    background-color: var(--color-primary, #ff7d59);
    color: #ffffff;
  }
  .btn-outline-secondary {
    border: 1px solid #d1d5db;
    color: #4b5563;
    background-color: transparent;
  }
  .btn-outline-secondary:hover {
    background-color: #f3f4f6;
  }
  .form-control, .form-select {
    width: 100%;
    padding: 0.5rem 0.75rem;
    border: 1px solid #d1d5db;
    border-radius: 0.375rem;
    font-size: 0.875rem;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.25rem 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    border-radius: 9999px;
  }
  .progress {
    height: 1rem;
    overflow: hidden;
    background-color: #e5e7eb;
    border-radius: 0.375rem;
  }
  .progress-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--color-primary, #ff7d59);
    color: #ffffff;
  }
</style>
