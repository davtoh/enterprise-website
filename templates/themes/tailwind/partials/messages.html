{% if messages %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 space-y-2">
  {% for message in messages %}
    <div 
      x-data="{ show: true }" 
      x-show="show" 
      x-transition:leave="transition ease-in duration-300"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="flex items-center justify-between p-4 rounded-lg shadow-sm border {% if message.tags == 'error' or message.tags == 'danger' %}bg-red-50 border-red-200 text-red-800{% elif message.tags == 'success' %}bg-green-50 border-green-200 text-green-800{% elif message.tags == 'alert' or message.tags == 'warning' %}bg-amber-50 border-amber-200 text-amber-800{% else %}bg-blue-50 border-blue-200 text-blue-800{% endif %}"
      role="alert">
      <div class="flex items-center space-x-3">
        <i class="fa {% if message.tags == 'error' or message.tags == 'danger' %}fa-exclamation-circle text-red-600{% elif message.tags == 'success' %}fa-check-circle text-green-600{% elif message.tags == 'alert' or message.tags == 'warning' %}fa-exclamation-triangle text-amber-600{% else %}fa-info-circle text-blue-600{% endif %}"></i>
        <span class="text-sm font-medium">{{ message }}</span>
      </div>
      <button 
        @click="show = false" 
        type="button" 
        class="inline-flex text-gray-400 hover:text-gray-700 focus:outline-none">
        <i class="fa fa-times text-sm"></i>
      </button>
    </div>
  {% endfor %}
</div>
{% endif %}
