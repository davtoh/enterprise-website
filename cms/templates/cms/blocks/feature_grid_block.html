<section class="cms-block-features py-5">
    <div class="container">
        {% if self.heading %}
            <h2 class="text-center mb-4">{{ self.heading }}</h2>
        {% endif %}
        <div class="row g-4">
            {% for item in self.features %}
                <div class="col-md-6 col-lg-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            {% if item.icon %}
                                <div class="mb-3 text-primary">
                                    <i class="fa {{ item.icon }} fa-2x" aria-hidden="true"></i>
                                </div>
                            {% endif %}
                            <h3 class="h5 card-title">{{ item.title }}</h3>
                            <p class="card-text text-muted">{{ item.description }}</p>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
