{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Login" %}{% endblock %}

{% block content %}
<section class="section-gap py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="card shadow-sm border-0 rounded-3 p-4">
          <h2 class="mb-4 text-center">{% trans "Sign In" %}</h2>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="mt-4 d-flex justify-content-between align-items-center">
              <button type="submit" class="btn btn-primary text-uppercase">{% trans "Login" %}</button>
              <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary text-uppercase">{% trans "Cancel" %}</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
