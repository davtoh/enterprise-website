{% extends "erp/base_erp.html" %}
{% load i18n %}

{% block erp_content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4 text-center">
        <div class="text-danger mb-3">
          <i class="fa fa-exclamation-triangle fa-3x"></i>
        </div>
        <h4 class="fw-bold mb-2">{% trans "Confirm Deletion" %}</h4>
        <p class="text-body-secondary mb-4">
          {% trans "Are you sure you want to permanently delete" %} <strong>{{ object }}</strong>?
          {% trans "This action cannot be undone." %}
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex align-items-center justify-content-center gap-2">
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">{% trans "Cancel" %}</a>
            <button type="submit" class="btn btn-danger px-4">{% trans "Yes, Delete" %}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
