{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %}{% endblock %}

{% block content %}
<section class="section-gap py-5">
  <div class="container text-center">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow-sm border-0 rounded-3 p-5">
          <i class="fa fa-check-circle fa-3x text-success mb-3"></i>
          <h3 class="mb-3">{% trans "The password has been changed!" %}</h3>
          <p class="text-muted"><a href="{% url 'user_management:login' %}" class="btn btn-primary text-uppercase">{% trans "Log in now" %}</a></p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
